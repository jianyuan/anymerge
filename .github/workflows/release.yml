name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: test "$(uv version --short)" = "${{ github.ref_name }}"

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish
