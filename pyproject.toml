[project]
name = "anymerge"
version = "0.1.0"
description = "Merge dataclasses, TypedDicts and Pydantic models field by field, with reducers declared in type annotations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["dataclasses", "deep-merge", "merge", "patch", "pydantic", "reducer", "typeddict"]
authors = [{ name = "Jian Yuan Lee", email = "jianyuan@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.10.0"]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]

[project.urls]
Homepage = "https://anymerge.jian.fyi"
Documentation = "https://anymerge.jian.fyi"
Changelog = "https://github.com/jianyuan/anymerge/releases"
Issues = "https://github.com/jianyuan/anymerge/issues"
Source = "https://github.com/jianyuan/anymerge"

[dependency-groups]
dev = ["mypy>=1.0.0", "pydantic>=2", "pytest", "pytest-cov", "ruff"]
docs = [
  "mkdocs-api-autonav",
  "mkdocs-autorefs",
  "mkdocstrings-python",
  "ruff",
  "zensical",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-vv"]

[tool.coverage.run]
source_pkgs = ["anymerge", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
anymerge = ["src/anymerge"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
extend-exclude = ["README.md", "docs", "docs_src"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
# shortcut: approximates hatch fmt's curated rule list; new ruff rules may need ignoring after upgrades
ignore = ["ANN", "COM812", "CPY", "D", "E501", "FBT001", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["anymerge"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.mypy]
plugins = ["pydantic.mypy"]
